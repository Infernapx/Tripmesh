name: Bug report
description: Create a report to help us improve TripMesh
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug!
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How do you trigger the issue? (e.g. Chat prompt or API payload)
      placeholder: |
        1. Start TripMesh
        2. Enter message '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened?
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Running Mode
      options:
        - Docker Compose
        - Local Python Mesh
        - GitHub Codespaces
    validations:
      required: true
